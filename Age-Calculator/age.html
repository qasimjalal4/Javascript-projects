<!DOCTYPE html>
<html>
<head>
  <title>Age Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="age.css">
</head>
<body>

  <div class="w-[480px] h-72 bg-white rounded-md shadow-md flex flex-col  items-center">
    <h1 class="pt-6 pb-6 text-3xl font-bold">Age Calculator</h1>
    <label class="font-semibold text-lg pb-2">Enter your age:</label>
    <input type="date" id="input-date" class="border border-gray-400 outline-none px-5 py-1 rounded-sm mb-2 cursor-pointer">
    <button id="calculate-button" class="bg-blue-600 border-none px-5 py-[5px] text-white rounded-md text-base mt-4 mb-3 cursor-pointer transition-all active:bg-blue-500">Calculate</button>
    <p id="result"></p>
  </div>

  <script src="age.js"></script>
</body>
</html>
